<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <title>Escaneo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="./resources/ionicons/css/ionicons.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
        <LINK REL="STYLESHEET" TYPE="TEXT/CSS" HREF="./CSS/distribucion.css">
        <LINK REL="STYLESHEET" TYPE="TEXT/CSS" HREF="./CSS/fondo2.css">
        <LINK REL="STYLESHEET" TYPE="TEXT/CSS" HREF="./CSS/escaneo.css">
    </HEAD>
    <BODY class="pagina-escaneo">

        <!-- Fondo 2 -->
        <div class="fondo-difuminado"></div>

        <button class="btn-volver" onclick="window.history.back()">
            <i class="icon ion-md-arrow-back"></i> VOLVER
        </button>

        <DIV class="escaneo-contenedor">

            <DIV class="escaneo-tarjeta">

                <DIV class="escaneo-visor" id="visorAR">
                    <!-- Activar camara -->
                    <!--<video id="videoCamara" class="video-camara" playsinline autoplay muted></video>-->
                    <!--
                    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta:0.001"
                            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                        <a-entity mindar-image-target="targetIndex: 0">
                            <a-gltf-model src="#mascota1" position="0 0 0"></a-gltf-model>
                        </a-entity>
                        <a-entity mindar-image-target="targetIndex: 1">
                            <a-gltf-model src="#mascota2"></a-gltf-model>
                        </a-entity>
                    </a-scene>-->
                    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta:0.001"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

                        <!-- 1. Aquí declaras tus modelos -->
                        <a-assets>
                            <a-asset-item id="mascotaSultanes" src="./resources/mascotas/Sultanes/sultanes.glb"></a-asset-item>
                            <a-asset-item id="mascotaSaraperos" src="./resources/mascotas/Saraperos/saraperos.glb"></a-asset-item>
                            <a-asset-item id="mascotaAlgodoneros" src="./resources/mascotas/UnionLaguna/algodoneros.glb"></a-asset-item>
                            <a-asset-item id="mascotaToros" src="./resources/mascotas/Toros/toros.glb"></a-asset-item>
                        </a-assets>

                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                        <!-- 2. Imagen 0 del .mind = Sultanes -->
                        <a-entity mindar-image-target="targetIndex: 0" data-equipo="sultanes">
                            <a-gltf-model src="#mascotaSultanes" position="0 0 0" scale="1 1 1" animation-mixer></a-gltf-model>
                        </a-entity>

                        <!-- 3. Imagen 1 del .mind = Saraperos -->
                        <a-entity mindar-image-target="targetIndex: 1" data-equipo="saraperos">
                            <a-gltf-model src="#mascotaSaraperos" position="0 0 0" scale="1 1 1" animation-mixer></a-gltf-model>
                        </a-entity>
                        <a-entity mindar-image-target="targetIndex: 2" data-equipo="algodoneros">
                            <a-gltf-model src="#mascotaAlgodoneros" position="0 0 0" scale="1 1 1" animation-mixer></a-gltf-model>
                        </a-entity>

                        <!-- 3. Imagen 1 del .mind = Saraperos -->
                        <a-entity mindar-image-target="targetIndex: 3" data-equipo="toros">
                            <a-gltf-model src="#mascotaToros" position="0 0 0" scale="1 1 1" animation-mixer></a-gltf-model>
                        </a-entity>
                    </a-scene>
                                    
                    <span class="esquina esquina-tl"></span>
                    <span class="esquina esquina-tr"></span>
                    <span class="esquina esquina-bl"></span>
                    <span class="esquina esquina-br"></span>
                </DIV>

                <DIV id="resultadoEscaneo" class="escaneo-resultado">
                    Apunta la cámara hacia la tarjeta
                </DIV>

            </DIV>

            <button id="btnActivarCamara" class="btn-activar-camara">
                <i class="icon ion-md-camera"></i> ACTIVAR CÁMARA
            </button>

            <!-- Boton prueba de resultados -->
            <a href="resultado.html" class="btn-escanear-provisional">
                <i class="icon ion-md-qr-scanner"></i> ESCANEAR
            </a>

        </DIV>

      
        <canvas id="canvasProcesamiento" style="display:none;"></canvas>
        <!--ARCHIVOS DE JS-->
        <script src="libs/mindar-image.prod.js"></script>
        <script src="libs/aframe.min.js"></script>
        <script src="LIBS/aframe-extras.min.js"></script>
        <script src="libs/mindar-image-aframe.prod.js"></script>
        <script src="./LIBS/confetti.browser.min.js"></script>
        <script src="./JS/escaneo.js"></script>
        <script src="./JS/confeti.js"></script>
        <script src="./JS/tema.js"></script>
    </BODY>
    <FOOTER>
   
    </FOOTER>
</HTML>
