<!DOCTYPE html>
<html lang="es">
<head>
    <title>Iniciar Sesión</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Iconos -->
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">

    <!-- Tipografías externas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS externos -->
    <link rel="stylesheet" type="text/css" href="./CSS/distribucion.css">
    <link rel="stylesheet" type="text/css" href="./CSS/movil.css">
    <link rel="stylesheet" type="text/css" href="./CSS/menus.css">
    <link rel="stylesheet" type="text/css" href="./CSS/posts.css">
    <link rel="stylesheet" type="text/css" href="./CSS/login.css">
    <link rel="stylesheet" type="text/css" href="./CSS/validaciones.css">
</head>
<body>
    <div class="log allscreen">
        <div class="formulario">
            <img src="./resources/Logo.png" alt="Logo BATTEAMX" class="logo">
            <div class="cabecera">
                <h1>Iniciar Sesión</h1>
            </div>
            <form action="index.html">
                <!-- Usuario -->
                <div class="input-grupo">
                    <i class="icon ion-md-person"></i>
                    <input type="text" id="usuario" name="usuario" placeholder="Usuario" class="inp">
                </div>
                <div class="validations">
                    <small class="pls">Por favor ingresa usuario</small>
                    <small class="error">El usuario debe tener al menos 4 caracteres, puede incluir números y guiones bajos</small>
                </div>

                <!-- Contraseña -->
                <div class="input-grupo">
                    <i class="icon ion-md-lock"></i>
                    <input type="password" id="password" class="inp" placeholder="Contraseña" required tabindex="0">
                </div>
                <div class="validations">
                    <small class="pls">Por favor ingresa contraseña</small>
                    <small class="error">La contraseña debe tener al menos 4 caracteres, puede incluir números y guiones bajos</small>
                </div>

                <!-- Botón -->
                <div class="enviar">
                    <input type="submit" class="btn" tabindex="0" value="Enviar">
                </div>
            </form>
           <a href="register.html">
  <span class="white-text">¿No tienes una cuenta?</span> ¡Regístrate ahora!
</a>
        </div>
    </div>
</body>
<footer>
    <!-- Script de validaciones -->
    <script src="./JS/Logvalidate.js"></script>
</footer>
</html>
