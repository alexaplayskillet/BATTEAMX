
<!DOCTYPE HTML>
<HTML lang="es">

<HEAD>
    <meta charset="UTF-8">
    <title>Reproductor de Video - BatteaMX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="./resources/ionicons/css/ionicons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <LINK REL="STYLESHEET" TYPE="TEXT/CSS" HREF="./CSS/distribucion.css">
    <LINK REL="STYLESHEET" TYPE="TEXT/CSS" HREF="./CSS/fondo2.css">
    <LINK REL="STYLESHEET" TYPE="TEXT/CSS" HREF="./CSS/posts.css">
    <LINK REL="STYLESHEET" TYPE="TEXT/CSS" HREF="./CSS/reproductor.css">
</HEAD>

<BODY class="pagina-reproductor">

    <div class="fondo-difuminado"></div>

    <button class="btn-volver" onclick="window.history.back()">
        <i class="icon ion-md-arrow-back"></i>
        VOLVER
    </button>

    <DIV class="reproductor-layout">

        <!-- COLUMNA IZQUIERDA -->
        <DIV class="reproductor-izquierda">

            <!-- CONTENEDOR DEL VIDEO -->
            <DIV class="video-wrapper" id="videoWrapper">

                <!-- REPRODUCTOR MP4 -->
                <video id="mainVideo"
                       class="video-principal"
                       poster="./resources/videos/thumb1.jpg">

                    <source src="./resources/videos/partido1.mp4"
                            type="video/mp4">

                </video>

                <!-- REPRODUCTOR YOUTUBE -->
                <div id="youtubeContenedor"
                     class="youtube-contenedor">
                </div>

                <!-- CONTROLES PARA MP4 -->
                <DIV class="video-controles">

                    <button id="btnPlayPause" class="ctrl-play">
                        <i class="icon ion-md-play"></i>
                    </button>

                    <button id="btnMute" class="ctrl-vol">
                        <i class="icon ion-md-volume-high"></i>
                    </button>

                    <span id="tiempoActual" class="ctrl-tiempo">
                        0:00
                    </span>

                    <input type="range"
                           id="barraProgreso"
                           class="ctrl-progreso"
                           value="0"
                           min="0"
                           max="100"
                           step="0.1">

                    <span id="tiempoTotal" class="ctrl-tiempo">
                        0:00
                    </span>

                    <button id="btnFullscreen" class="ctrl-fullscreen">
                        <i class="icon ion-md-expand"></i>
                    </button>

                </DIV>

            </DIV>

            <!-- TITULO Y DESCRIPCION FUERA DEL VIDEO -->
            <h2 class="video-titulo" id="tituloVideo">
                SELECCIONA UN VIDEO
            </h2>

            <p class="video-descripcion" id="descripcionVideo">
                Explora los momentos históricos del béisbol mexicano
                y selecciona un video desde nuestro carrusel.
            </p>

        </DIV>

        <!-- COLUMNA DERECHA -->
        <DIV class="reproductor-derecha">

            <h2 class="filtros-titulo">FILTROS</h2>

            <DIV class="filtros-separador">
                <span class="linea-sep"></span>
                <i class="icon ion-md-baseball"></i>
                <span class="linea-sep"></span>
            </DIV>

            
            <button class="btn-filtro" data-filtro="desenfoque">
                DESENFOQUE
            </button>

            <button class="btn-filtro" data-filtro="termico">
                TÉRMICO
            </button>

            <button class="btn-filtro" data-filtro="verde">
                VISIÓN VERDE
            </button>

            <button class="btn-filtro" data-filtro="retro">
                RETRO
            </button>


            <hr class="filtros-hr">

            <button class="btn-limpiar">
                LIMPIAR
            </button>

        </DIV>

    </DIV>

    <SCRIPT SRC="./JS/reproductor.js"></SCRIPT>
    <SCRIPT SRC="./JS/tema.js"></SCRIPT>
    <SCRIPT SRC="./JS/cargar-video.js"></SCRIPT>
    <SCRIPT SRC="./JS/filtros-video.js"></SCRIPT>

</BODY>
</HTML>
