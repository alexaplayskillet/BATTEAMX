<!DOCTYPE html>
<html lang="es">
<head>
    <title>Registro de usuario</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Iconos y tipografías -->
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="./CSS/login.css">
    <link rel="stylesheet" type="text/css" href="./CSS/validaciones.css">
</head>
<body>
    <div class="log">
        <div class="formulario">
            <!-- Logo arriba -->
            <img src="./resources/Logo.png" alt="Logo BATTEAMX" class="logo">

            <!-- Título -->
            <div class="cabecera">
                <h1>Registro</h1>
            </div>

            <!-- Formulario -->
            <form action="login.html">
                <!-- Usuario -->
                <div class="input-grupo">
                    <i class="icon ion-md-person"></i>
                    <input type="text" id="usuario" name="usuario" placeholder="Usuario" class="inp">
                </div>
                <div class="validations">
                    <small class="pls">Por favor ingresa usuario</small>
                    <small class="error">El usuario debe tener al menos 4 caracteres</small>
                </div>

                <!-- Correo -->
                <div class="input-grupo">
                    <i class="icon ion-md-mail"></i>
                    <input type="email" id="email" name="email" placeholder="Correo electrónico" class="inp">
                </div>
                <div class="validations">
                    <small class="pls">Por favor ingresa correo</small>
                    <small class="error">El correo debe ser válido e incluir @</small>
                </div>

                <!-- Contraseña -->
                <div class="input-grupo">
                    <i class="icon ion-md-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Contraseña" class="inp">
                </div>
                <div class="validations">
                    <small class="pls">Por favor ingresa contraseña</small>
                    <small class="error">La contraseña debe tener al menos 4 caracteres</small>
                </div>

                <!-- Botón -->
                <div class="enviar">
                    <input type="submit" class="btn btn-green" value="Registrar">
                </div>
            </form>
                <a href="login.html">
  <span class="white-text">¿Ya tienes una cuenta?</span> ¡Inicia Sesión!
</a>
        </div>
    </div>
</body>
<footer>
    <script src="./JS/Regvalidate.js"></script>
</footer>
</html>
